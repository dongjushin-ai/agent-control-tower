name: Release

# Runs when a version tag is pushed (or a GitHub release creates one): v0.1.0, v0.2.0, ...
# Tests, then STAGES the version on npm with provenance. Nothing becomes installable until
# a maintainer approves it on npmjs.com (Staged Packages tab) with 2FA - see docs/releasing.md.
# Auth: npm trusted publishing (OIDC, no secret) once configured on npmjs.com;
# for the very first release, a short-lived NPM_TOKEN secret instead.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing
        run: npm install -g npm@latest && npm --version
      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - name: Tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Stage on npm (approve on npmjs.com to publish)
        run: npm stage publish . --provenance --access public
